[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msa"
version = "0.1.0"
description = "Multimodal sentiment analysis research code"
# 3.10 until 2026-09-04, which was untrue: requirements-lock.txt cannot be
# resolved below 3.11 (networkx==3.6.1), so setup.sh built nothing at all on a
# 3.10 machine. 3.12 rather than 3.11 because all 305 committed runs recorded
# 3.12.x, and the interpreter decides which wheels resolve.
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "torch",
    "tqdm",
    # Eight of the fourteen models fine-tune BERT. Undeclared until 2026-08-01,
    # which meant setup.sh built an environment that could not train half the
    # models — and no gate caught it, because the gates read stored results and
    # never construct a model.
    "transformers>=5,<6",
]

[tool.setuptools.packages.find]
where = ["src"]
