[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msa"
version = "0.1.0"
description = "Multimodal sentiment analysis research code"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "torch",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
